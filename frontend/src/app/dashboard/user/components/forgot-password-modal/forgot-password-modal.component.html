<h2 mat-dialog-title>Restablecer Contraseña</h2>
<mat-dialog-content>
  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Correo Electrónico</mat-label>
      <input matInput formControlName="email" type="email">
      @if (email?.invalid && email?.touched) {
      <mat-error>
        @if (email?.errors?.['required']) {
        El correo es requerido
        }
        @if (email?.errors?.['email']) {
        Ingrese un correo válido
        }
      </mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button class="cancel-button" (click)="onCancel()">Cancelar</button>
  <button mat-raised-button class="submit-button" color="primary" (click)="onSubmit()" [disabled]="isLoading()">
    @if (isLoading()) {
    <mat-spinner diameter="20"></mat-spinner>
    Enviando...
    } @else {
    <ng-container>
      <mat-icon>email</mat-icon>
      Enviar
    </ng-container>
    }
  </button>
</mat-dialog-actions>
